# Внешний сторож фабрики: проверяет сайты СНАРУЖИ, с чужой машины.
#
# Зачем. На сервере уже есть /usr/local/bin/sreda-monitor.sh, но он живёт
# на том же сервере, за которым следит: умер сервер целиком, пропала сеть
# или диск — сообщения не будет вообще. Этот сторож работает на машинах
# GitHub и потому переживает смерть сервера.
#
# Исходник — в приватном репозитории фабрики: factory/server/watch/uptime.yml.
# Рабочая копия — в ПУБЛИЧНОМ репозитории Andreysenior/real-best-watch,
# файл .github/workflows/uptime.yml. Публичный он ради бесплатных минут:
# у приватного репозитория Actions расходуют квоту, у публичного — нет.
# Внутри нет ничего секретного: только адреса, открытые и так. Токен бота
# лежит в секретах репозитория, в коде его нет.
#
# Тревога уходит в Telegram при КАЖДОЙ неудачной проверке, пока сайт лежит:
# у workflow нет памяти между запусками, поэтому «сообщать только при смене
# состояния», как на сервере, здесь не сделать. Это и к лучшему: повторное
# сообщение раз в 15 минут не даст забыть про лежащий сайт.
name: Сторож real-best

on:
  schedule:
    # Каждые 15 минут. GitHub запускает расписания с задержкой в несколько
    # минут и может пропустить запуск при своей высокой нагрузке — для
    # запасного сторожа это допустимо, точность даёт монитор на сервере.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      trevoga:
        description: 'Проверить тревогу: подставить заведомо мёртвый адрес и убедиться, что сообщение дошло'
        type: boolean
        default: false

jobs:
  proverka:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить адреса
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -u
          spisok=""
          bed=0

          # Ожидаемые коды перечисляются через пробел: кабинет без входа
          # отвечает переадресацией, и это норма, а не сбой.
          proverit() {
            adres=$1
            zhdyom=$2
            popytka=1
            while [ "$popytka" -le 2 ]; do
              kod=$(curl -s -m 20 -o /dev/null -w '%{http_code}' "$adres" || echo 000)
              for w in $zhdyom; do
                if [ "$kod" = "$w" ]; then
                  echo "$adres: $kod — ок"
                  return 0
                fi
              done
              # Вторая попытка через полминуты: одиночный сбой сети у GitHub
              # не должен будить хозяина ночью.
              [ "$popytka" = 1 ] && sleep 30
              popytka=$((popytka + 1))
            done
            echo "$adres: код $kod, ждали $zhdyom"
            spisok="$spisok
          $adres — код $kod"
            bed=1
          }

          # Учебная тревога: запуск руками с галочкой. Иначе путь «сайт лёг»
          # не проверялся бы никогда — а сторож, чья тревога не доходит,
          # хуже отсутствия сторожа: на него надеются.
          if [ "${{ inputs.trevoga }}" = "true" ]; then
            proverit https://real-best.ru/takogo-adresa-net-eto-uchebnaya-trevoga "200"
          fi

          proverit https://real-best.ru/ "200"
          proverit https://lk.real-best.ru/ "200 302"
          proverit https://api.real-best.ru/health "200"

          if [ "$bed" = 0 ]; then
            echo "всё отвечает"
            exit 0
          fi

          # Сообщение уходит, только если токен положен в секреты репозитория.
          # Без него шаг всё равно падает: красный значок виден в GitHub
          # и приходит письмом на почту владельца.
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            # Учения должны быть подписаны учениями. Иначе сообщение
            # неотличимо от настоящей тревоги, и человек ночью поднимается
            # чинить то, что не сломано.
            if [ "${{ inputs.trevoga }}" = "true" ]; then
              shapka="🧪 УЧЕБНАЯ ТРЕВОГА. Это проверка сторожа, ничего не сломалось."
              hvost="Адрес ниже не существует нарочно. Сообщение одно, повторов не будет."
            else
              shapka="🔴 Внешний сторож: фабрика не отвечает снаружи."
              hvost="Проверка каждые 15 минут, сообщения будут повторяться, пока не поднимется. Сторож на самом сервере при этом может молчать: он умирает вместе с сервером."
            fi

            tekst="$shapka
          $spisok

          $hvost"
            # Код ответа печатаем: молчащая тревога — та же поломка, что и
            # молчащий сторож, и увидеть её можно только здесь. 200 значит
            # Telegram сообщение принял, всё остальное надо разбирать.
            otvet=$(curl -s -m 20 -o /dev/null -w '%{http_code}' -X POST \
              "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=$tekst")
            echo "telegram ответил: $otvet"
          else
            echo "токена или чата в секретах нет — тревога ушла только письмом от GitHub"
          fi
          exit 1
